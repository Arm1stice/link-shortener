<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Link Shortener</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css" integrity="sha384-WskhaSGFgHYWDcbwN70/dfYBj47jz9qbsMId/iRN3ewGhXQFZCSftd1LZCfmhktB"
        crossorigin="anonymous">
    <style>
        .result-controls {
            display: flex;
            align-items: center;
            gap: .75rem;
            min-width: 0;
        }

        .result-controls a {
            min-width: 0;
            overflow-wrap: anywhere;
        }

        @media (max-width: 575.98px) {
            .navbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .navbar-text {
                padding-top: 0;
            }

            .container {
                padding-right: 0;
                padding-left: 0;
            }

            .jumbotron {
                margin-bottom: 0;
                padding: 2rem 1.25rem;
                border-radius: 0;
            }

            .jumbotron .display-4 {
                font-size: 2.25rem;
            }

            .result-controls {
                align-items: stretch;
                flex-direction: column;
            }

            .result-controls .btn {
                align-self: flex-start;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-dark bg-primary">
        <a class="navbar-brand" href="/">Link Shortener</a>
        <span class="navbar-text">Created by Wyatt Calandro</span>
    </nav>

    <div class="container">
        <div class="jumbotron mt-sm-4">
            <h1 class="display-4">Wyatt Calandro's Link Shortener</h1>
            <p class="lead">A basic link shortening service created by Wyatt Calandro as part of his delve into the Go programming language</p>
            <hr class="my-4">

            <form id="shorten-form">
                <label class="sr-only" for="url">URL to shorten</label>
                <input id="url" class="form-control" name="url" inputmode="url" autocomplete="url" placeholder="URL to shorten" required>
                <br>
                <button id="submit-button" type="submit" class="btn btn-primary">Submit link</button>
            </form>

            <div id="error" class="alert alert-danger mt-3 mb-0" role="alert" hidden></div>
            <div id="result" class="alert alert-success mt-3 mb-0" role="status" hidden>
                <div class="result-controls">
                    <span>Success! Generated Link <a id="short-url" href=""></a></span>
                    <button id="copy-button" type="button" class="btn btn-sm btn-outline-success">Copy link</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.querySelector('#shorten-form');
        const urlInput = document.querySelector('#url');
        const submitButton = document.querySelector('#submit-button');
        const errorBox = document.querySelector('#error');
        const resultBox = document.querySelector('#result');
        const shortURL = document.querySelector('#short-url');
        const copyButton = document.querySelector('#copy-button');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            errorBox.hidden = true;
            resultBox.hidden = true;
            submitButton.disabled = true;
            submitButton.textContent = 'Submitting…';

            try {
                const response = await fetch('/api/links', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: urlInput.value })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Unable to shorten URL');

                shortURL.href = data.short_url;
                shortURL.textContent = data.short_url;
                resultBox.hidden = false;
            } catch (error) {
                errorBox.textContent = error.message || 'Unable to shorten URL';
                errorBox.hidden = false;
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = 'Submit link';
            }
        });

        copyButton.addEventListener('click', async () => {
            await navigator.clipboard.writeText(shortURL.href);
            copyButton.textContent = 'Copied!';
            window.setTimeout(() => { copyButton.textContent = 'Copy link'; }, 1600);
        });
    </script>
</body>

</html>
